<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeonAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500&family=JetBrains+Mono&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #18181B;
            color: #E4E4E7;
            overflow: hidden;
        }

        .font-serif { font-family: 'Playfair Display', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3F3F46;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525B;
        }

        .selection-amber::selection {
            background: #D4896A;
            color: white;
        }

        .message-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="selection-amber">
    <div class="flex flex-col h-screen bg-[#18181B]">
        <!-- Header -->
        <header class="flex-none flex items-center justify-between px-6 py-4 border-b border-[#27272A] bg-[#18181B] sticky top-0 z-10">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-md bg-[#27272A] flex items-center justify-center border border-[#3F3F46]">
                    <i data-lucide="sparkles" class="w-4 h-4 text-[#F4F4F5]"></i>
                </div>
                <h1 class="font-serif text-xl font-medium text-[#F4F4F5]">LeonAI</h1>
            </div>
            <div class="relative">
                <button id="optionsBtn" class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-[#3F3F46] text-sm font-medium hover:bg-[#27272A] transition-colors text-[#D4D4D8]">
                    <i data-lucide="settings" class="w-4 h-4 text-[#A1A1AA]"></i>
                    Options
                </button>
                <!-- Options Menu -->
                <div id="optionsMenu" class="hidden absolute right-0 mt-2 w-80 bg-[#1E1E24] rounded-xl shadow-2xl border border-[#3F3F46] p-3 z-50">
                    <div class="mb-4 pb-4 border-b border-[#3F3F46]">
                        <label class="block text-[11px] uppercase tracking-wider font-bold text-[#71717A] mb-2">Gemini API Connection</label>
                        <div class="flex gap-2">
                            <input 
                                type="text" 
                                id="statusInput" 
                                readonly
                                value="Connected to Environment"
                                class="flex-1 bg-[#27272A] border border-[#3F3F46] rounded-lg px-3 py-1.5 text-xs text-[#A1A1AA] focus:outline-none"
                            >
                        </div>
                    </div>
                    <div class="space-y-1" id="toggleList">
                        <!-- Toggles injected via JS -->
                    </div>
                </div>
            </div>
        </header>

        <!-- Chat Container -->
        <div id="chatContainer" class="flex-1 overflow-y-auto w-full scroll-smooth">
            <div id="messagesList" class="max-w-3xl mx-auto px-4 py-8 flex flex-col gap-8">
                <div id="emptyState" class="flex flex-col items-center justify-center mt-32 text-center space-y-4 opacity-80">
                    <div class="w-16 h-16 rounded-2xl bg-[#27272A] flex items-center justify-center mb-4 border border-[#3F3F46]">
                        <i data-lucide="sparkles" class="w-8 h-8 text-[#D4896A]"></i>
                    </div>
                    <h2 class="font-serif text-3xl text-[#F4F4F5]">Hi Leon, how can I help?</h2>
                </div>
            </div>
            <div id="anchor"></div>
        </div>

        <!-- Input Area -->
        <div class="flex-none w-full bg-[#18181B] pt-4 pb-6">
            <div class="max-w-3xl mx-auto px-4 relative">
                <div class="bg-[#27272A] border border-[#3F3F46] rounded-2xl flex flex-col p-2">
                    <textarea
                        id="userInput"
                        placeholder="Type here..."
                        class="w-full bg-transparent border-none focus:ring-0 focus:outline-none resize-none px-3 py-2 text-[15px] placeholder-[#71717A] text-[#E4E4E7] min-h-[52px]"
                        rows="1"
                    ></textarea>
                    <div class="flex justify-between items-center mt-1 px-1">
                        <button class="p-2 text-[#A1A1AA] hover:text-[#F4F4F5] hover:bg-[#3F3F46] rounded-lg">
                            <i data-lucide="paperclip" class="w-[18px] h-[18px]"></i>
                        </button>
                        <button 
                            id="sendBtn"
                            class="p-2 rounded-lg flex items-center justify-center transition-all bg-[#3F3F46] text-[#71717A] cursor-not-allowed disabled:opacity-50"
                            disabled
                        >
                            <i data-lucide="send" class="w-[18px] h-[18px]"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "";
        const MODEL_NAME = "gemini-2.5-flash-preview-09-2025"; 
        
        const state = {
            messages: [],
            options: {
                structOut: false,
                codeExec: false,
                googleSearch: false,
                urlContext: false,
                genImage: false
            },
            isLoading: false
        };

        const elements = {
            optionsBtn: document.getElementById('optionsBtn'),
            optionsMenu: document.getElementById('optionsMenu'),
            toggleList: document.getElementById('toggleList'),
            userInput: document.getElementById('userInput'),
            sendBtn: document.getElementById('sendBtn'),
            messagesList: document.getElementById('messagesList'),
            emptyState: document.getElementById('emptyState'),
            chatContainer: document.getElementById('chatContainer'),
            anchor: document.getElementById('anchor')
        };

        const toggles = [
            { key: 'structOut', label: 'Structured outputs', icon: 'file-json' },
            { key: 'codeExec', label: 'Code execution', icon: 'code' },
            { key: 'googleSearch', label: 'Grounding with Google', icon: 'search' },
            { key: 'urlContext', label: 'URL context', icon: 'link' },
            { key: 'genImage', label: 'Generate Image', icon: 'image' }
        ];

        function initToggles() {
            elements.toggleList.innerHTML = toggles.map(t => `
                <div class="flex items-center justify-between py-2.5 px-3 hover:bg-[#303036] rounded-lg cursor-pointer transition-colors" data-toggle="${t.key}">
                    <div class="flex items-center gap-3">
                        <i data-lucide="${t.icon}" class="w-[18px] h-[18px] ${state.options[t.key] ? 'text-[#E5A58A]' : 'text-[#A1A1AA]'}"></i>
                        <span class="text-sm font-medium text-[#E4E4E7]">${t.label}</span>
                    </div>
                    <div class="w-8 h-4.5 flex items-center rounded-full p-0.5 transition-colors duration-200 ease-in-out ${state.options[t.key] ? 'bg-[#D4896A]' : 'bg-[#52525B]'}">
                        <div class="bg-[#F4F4F5] w-3.5 h-3.5 rounded-full shadow-sm transform transition-transform duration-200 ease-in-out ${state.options[t.key] ? 'translate-x-3.5' : 'translate-x-0'}"></div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();

            document.querySelectorAll('[data-toggle]').forEach(el => {
                el.onclick = () => {
                    const key = el.getAttribute('data-toggle');
                    state.options[key] = !state.options[key];
                    initToggles();
                    validateInput();
                };
            });
        }

        function validateInput() {
            const hasText = elements.userInput.value.trim().length > 0;
            if (hasText && !state.isLoading) {
                elements.sendBtn.classList.remove('bg-[#3F3F46]', 'text-[#71717A]', 'cursor-not-allowed');
                elements.sendBtn.classList.add('bg-[#D4896A]', 'text-white');
                elements.sendBtn.disabled = false;
            } else {
                elements.sendBtn.classList.add('bg-[#3F3F46]', 'text-[#71717A]', 'cursor-not-allowed');
                elements.sendBtn.classList.remove('bg-[#D4896A]', 'text-white');
                elements.sendBtn.disabled = true;
            }
        }

        elements.userInput.oninput = () => {
            validateInput();
            elements.userInput.style.height = 'auto';
            elements.userInput.style.height = elements.userInput.scrollHeight + 'px';
        };

        elements.userInput.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        };

        elements.sendBtn.onclick = () => handleSend();
        elements.optionsBtn.onclick = (e) => {
            e.stopPropagation();
            elements.optionsMenu.classList.toggle('hidden');
        };
        window.onclick = () => elements.optionsMenu.classList.add('hidden');
        elements.optionsMenu.onclick = (e) => e.stopPropagation();

        async function fetchGeminiResponse(userPrompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
            
            let retries = 0;
            const maxRetries = 5;
            const delays = [1000, 2000, 4000, 8000, 16000];
            
            // Build simple history for payload
            const contents = state.messages.map(m => ({
                role: m.role === 'model' ? 'model' : 'user',
                parts: [{ text: m.text }]
            }));
            contents.push({ role: "user", parts: [{ text: userPrompt }] });

            const payload = {
                contents: contents,
                systemInstruction: { parts: [{ text: "You are LeonAI. Helpful and concise." }] }
            };

            if (state.options.googleSearch) {
                payload.tools = [{ google_search: {} }];
            }

            while (retries < maxRetries) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || `API Error: ${response.status}`);
                    }

                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error("No response content");
                    return text;
                } catch (error) {
                    retries++;
                    if (retries >= maxRetries) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[retries-1]));
                }
            }
        }

        function formatContent(text) {
            if (!text) return "";
            // Simple markdown-style formatting for code and bold
            return text
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") 
                .replace(/```([\s\S]*?)```/g, (match, code) => {
                    const lines = code.split('\n');
                    const lang = lines[0].trim();
                    const actualCode = lines.slice(1).join('\n').trim();
                    return `<div class="my-4 bg-[#27272A] rounded-lg overflow-hidden border border-[#3F3F46]">
                        ${lang ? `<div class="text-xs text-[#A1A1AA] px-4 py-2 bg-[#303036] border-b border-[#3F3F46] uppercase tracking-wider font-semibold">${lang}</div>` : ''}
                        <pre class="p-4 overflow-x-auto"><code class="text-sm text-[#E4E4E7] font-mono">${actualCode}</code></pre>
                    </div>`;
                })
                .replace(/\*\*([^*]+)\*\*/g, '<strong class="text-[#F4F4F5] font-semibold">$1</strong>')
                .replace(/`([^`]+)`/g, '<code class="bg-[#27272A] text-[#E5A58A] px-1.5 py-0.5 rounded-md text-sm">$1</code>')
                .replace(/\n/g, '<br/>');
        }

        function appendMessage(role, text) {
            if (elements.emptyState) elements.emptyState.classList.add('hidden');
            const div = document.createElement('div');
            div.className = "flex gap-4 group message-fade-in";
            
            const avatar = role === 'user' 
                ? `<div class="w-8 h-8 rounded-full bg-[#27272A] border border-[#3F3F46] flex items-center justify-center"><i data-lucide="user" class="w-4 h-4 text-[#A1A1AA]"></i></div>`
                : `<div class="w-8 h-8 rounded-md bg-[#18181B] border border-[#3F3F46] flex items-center justify-center shadow-sm"><i data-lucide="sparkles" class="w-4 h-4 text-[#D4896A]"></i></div>`;

            div.innerHTML = `
                <div class="flex-none mt-1">${avatar}</div>
                <div class="flex-1 min-w-0">
                    <div class="font-medium text-sm text-[#F4F4F5] mb-1">${role === 'user' ? 'Leon' : 'LeonAI'}</div>
                    <div class="text-[15px] leading-relaxed text-[#D4D4D8] break-words">${formatContent(text)}</div>
                </div>
            `;
            
            elements.messagesList.appendChild(div);
            lucide.createIcons();
            elements.anchor.scrollIntoView({ behavior: 'smooth' });
        }

        async function handleSend() {
            const input = elements.userInput.value.trim();
            if (!input || state.isLoading) return;

            state.isLoading = true;
            appendMessage('user', input);
            elements.userInput.value = '';
            elements.userInput.style.height = 'auto';
            validateInput();

            const loader = document.createElement('div');
            loader.id = 'typing-loader';
            loader.className = "flex gap-4 mb-8";
            loader.innerHTML = `<div class="w-8 h-8 rounded-md bg-[#27272A] border border-[#3F3F46] animate-pulse"></div><div class="flex-1 h-12 bg-[#27272A] rounded-xl animate-pulse"></div>`;
            elements.messagesList.appendChild(loader);
            elements.anchor.scrollIntoView({ behavior: 'smooth' });

            try {
                const response = await fetchGeminiResponse(input);
                loader.remove();
                appendMessage('model', response);
                state.messages.push({ role: 'user', text: input }, { role: 'model', text: response });
            } catch (err) {
                loader.remove();
                appendMessage('model', `**Error:** ${err.message}`);
            } finally {
                state.isLoading = false;
                validateInput();
            }
        }

        initToggles();
        lucide.createIcons();
    </script>
</body>
</html>
